name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python main.py --demo --seed 7 --target 100
  external-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path tools/dave_bridge/Cargo.toml
      - name: External search compatibility smoke test
        run: >-
          python -m tichu.external benchmark --opponent eg:pimc20/hibs
          --pairs 2 --seed 11000000 --workers 2
          --output experiments/external/ci-smoke
